services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1

  frontend:
    build:
      context: ./gui
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./gui:/app
      - /app/node_modules
    environment:
      - BACKEND_URL=http://server:5000
      - WATCHPACK_POLLING=true
    depends_on:
      - server
